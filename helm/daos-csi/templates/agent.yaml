{{- if .Values.agent.enabled }}
{{- if not .Values.agent.config.access_points }}
{{- fail "agent.config.access_points is required with agent.enabled" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.agent.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daos-csi.labels" . | nindent 4 }}
data:
  daos_agent.yml: |
    {{- toYaml .Values.agent.config | nindent 4 }}
  passwd: |
    {{- .Values.agent.passwd | nindent 4 }}
  group: |
    {{- .Values.agent.group | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.agent.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "daos-csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {app: {{ .Values.agent.name }}}
  updateStrategy:
    rollingUpdate: {maxUnavailable: 1}
  template:
    metadata:
      labels:
        app: {{ .Values.agent.name }}
        {{- include "daos-csi.labels" . | nindent 8 }}
      annotations:
        # restart the agents when their configuration changes
        checksum/config: {{ toYaml .Values.agent | sha256sum }}
    spec:
      # the agent reports the node's fabric interfaces and must see client processes (pids from
      # SO_PEERCRED, /proc) across the node
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      priorityClassName: system-node-critical
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.agent.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.agent.tolerations }}
      tolerations: {{- toYaml . | nindent 6 }}
      {{- end }}
      containers:
      - name: daos-agent
        image: {{ include "daos-csi.agentImage" . }}
        imagePullPolicy: {{ default .Values.image.pullPolicy .Values.agent.image.pullPolicy }}
        command: [daos_agent, -o, /etc/daos-agent/daos_agent.yml, -s, /var/run/daos_agent]
        {{- if .Values.agent.privileged }}
        # RDMA devices for the fabric scan
        securityContext: {privileged: true}
        {{- end }}
        {{- with .Values.agent.resources }}
        resources: {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - {name: config, mountPath: /etc/daos-agent}
        - {name: config, mountPath: /etc/passwd, subPath: passwd, readOnly: true}
        - {name: config, mountPath: /etc/group, subPath: group, readOnly: true}
        - {name: runtime, mountPath: /var/run/daos_agent}
        readinessProbe:
          exec: {command: [test, -S, /var/run/daos_agent/daos_agent.sock]}
          periodSeconds: 10
      volumes:
      - {name: config, configMap: {name: {{ .Values.agent.name }}}}
      - {name: runtime, hostPath: {path: {{ .Values.node.agentDir }}, type: DirectoryOrCreate}}
{{- end }}
